services:

  #POSTGRES
  postgres-container:
    image: postgres:18
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Sao_Paulo
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    networks:
      app-network:
        aliases:
          - postgres_host

  #NODE WEB
  nodeweb-container:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - ./.env
      - ./.env.docker
    environment:
      IS_DOCKER: "true"
      POSTGRES_HOST: postgres_host
      POSTGRES_PORT: 5432
      NODE_WEB_HOST: nodeweb_host
      NODE_WEB_PORT: 3000
      NODE_WEB_EXTERNAL_PORT: 8080
    depends_on:
      - postgres-container
    networks:
      app-network:
        aliases:
          - nodeweb_host

  #NGINX
  nginx-container:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - nodeweb-container
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
